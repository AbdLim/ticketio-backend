[project]
name = "ticketio-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "fastapi>=0.116.2",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "asyncpg>=0.29.0",
    "pydantic>=2.11.9",
    "pydantic-core>=2.33.2",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "redis[hiredis]>=6.4.0",
    "sqlmodel>=0.0.24",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.2.0"]

[tool.uv]
package = true

[tool.setuptools]
packages = ["app"]

[project.scripts]
dev = "app.main:start"
